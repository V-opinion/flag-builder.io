<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flag Builder – ccTLD Flag Editor</title>
  <style>
    body {
      background: #f9f9f9;
      font-family: 'Inter', Arial, sans-serif;
      margin: 0; padding: 0; color: #222;
    }
    header {
      background: #0366d6; color: #fff;
      padding: 1em 2em; text-align: left;
    }
    main { padding: 2em; display: flex; gap: 2em; }
    .sidebar {
      min-width: 200px; background: #f1f4f6; padding: 1em;
      border-radius: 0.7em; box-shadow: 0 0 8px #eee;
    }
    .canvas-area {
      flex-grow: 1; background: #fff; padding: 2em;
      border-radius: 1em; box-shadow: 0 0 12px #ddd;
    }
    h1 { margin: 0 0 0.2em 0; font-size: 2em; }
    h2, h3 { margin-top: 1em; }
    button { margin: 2px 0.5em 2px 0; }
    input[type="color"] { width: 36px; height: 1.5em; padding: 0; border: none; }
    .selectedTextMsg { color: #00aaff; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Flag Builder</h1>
    <p>Create and customize ccTLD flags for .se, .no, .dk, and .fi. Add letters, drag, and export!</p>
  </header>
  <main>
    <div class="sidebar">
      <h2>Templates</h2>
      <button onclick="loadFlag('se')">Sweden (.se)</button><br>
      <button onclick="loadFlag('no')">Norway (.no)</button><br>
      <button onclick="loadFlag('dk')">Denmark (.dk)</button><br>
      <button onclick="loadFlag('fi')">Finland (.fi)</button><br>

      <h3>Add .se Letters</h3>
<button onclick="addColoredSE()">Add .se with Colors</button>

      
         <input type="text" id="addLetterInput" placeholder="A-Z or .se" maxlength="8" style="width:80px;" />
      <button onclick="addLetter()">Add</button>
      <div id="textControls" style="margin-top:1.5em;">
        <div id="selectedTextPanel" style="margin-top:10px;"></div>
      </div>
      <br>
      <button onclick="exportSVG()">Export SVG</button>
      <button onclick="exportPNG()">Export PNG</button>
    </div>
    <div class="canvas-area">
      <svg id="flagCanvas" width="320" height="200" style="border:1px solid #333; background:#fff; touch-action:none;">
        <!-- Shapes will be drawn here via JS -->
      </svg>
      <div style="margin-top:1em;font-size:0.95em;color:#888;">
        <em>Tip: Tap/click and drag text to move it. Tap to edit, change color, or delete.</em>
      </div>
    </div>
  </main>
  <script>
    // Flag templates
    const flagTemplates = {
      se: [
        { type: "rect", x: 0, y: 0, width: 320, height: 200, fill: "#006aa7" },
        { type: "rect", x: 90, y: 0, width: 40, height: 200, fill: "#fecc00" },
        { type: "rect", x: 0, y: 80, width: 320, height: 40, fill: "#fecc00" }
      ],
      no: [
        { type: "rect", x: 0, y: 0, width: 320, height: 200, fill: "#ba0c2f" },
        { type: "rect", x: 85, y: 0, width: 40, height: 200, fill: "#fff" },
        { type: "rect", x: 0, y: 80, width: 320, height: 40, fill: "#fff" },
        { type: "rect", x: 95, y: 0, width: 20, height: 200, fill: "#00205b" },
        { type: "rect", x: 0, y: 90, width: 320, height: 20, fill: "#00205b" }
      ],
      dk: [
        { type: "rect", x: 0, y: 0, width: 320, height: 200, fill: "#c60c30" },
        { type: "rect", x: 110, y: 0, width: 30, height: 200, fill: "#fff" },
        { type: "rect", x: 0, y: 70, width: 320, height: 30, fill: "#fff" }
      ],
      fi: [
        { type: "rect", x: 0, y: 0, width: 320, height: 200, fill: "#fff" },
        { type: "rect", x: 80, y: 0, width: 40, height: 200, fill: "#003580" },
        { type: "rect", x: 0, y: 75, width: 320, height: 40, fill: "#003580" }
      ]
    };

    let userFlag = [];
    let selectedTextId = null;
    let dragOffset = null;

    function addLetter() {
      const txt = document.getElementById('addLetterInput').value.trim();
      if (!txt) return;
      userFlag.push({
        type: "text", text: txt,
        x: 120, y: 110,
        fontSize: 56,
        fill: "#fff",
        fontWeight: "bold",
        id: "l" + (Math.random() * 100000).toFixed(0)
      });
      drawFlag(userFlag);
      document.getElementById('addLetterInput').value = "";
      selectText(userFlag[userFlag.length - 1].id);
    }

    function drawFlag(shapes) {
      const svg = document.getElementById('flagCanvas');
      svg.innerHTML = '';
      shapes.forEach((shape, idx) => {
        let el;
        if (shape.type === 'rect') {
          el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          el.setAttribute('x', shape.x);
          el.setAttribute('y', shape.y);
          el.setAttribute('width', shape.width);
          el.setAttribute('height', shape.height);
          el.setAttribute('fill', shape.fill);
        }
        if (shape.type === 'text') {
          el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          el.setAttribute('x', shape.x);
          el.setAttribute('y', shape.y);
          el.setAttribute('fill', shape.fill);
          el.setAttribute('font-size', shape.fontSize);
          el.setAttribute('font-weight', shape.fontWeight || "normal");
          el.setAttribute('font-family', "Arial, sans-serif");
          el.textContent = shape.text;
          el.setAttribute('cursor', 'move');
          if (selectedTextId === shape.id) {
            el.setAttribute('stroke', '#00aaff');
            el.setAttribute('stroke-width', "2");
          }
          // Mouse drag events
          el.addEventListener('mousedown', function(evt) {
            selectText(shape.id);
            dragOffset = { x: evt.offsetX - shape.x, y: evt.offsetY - shape.y };
            svg.addEventListener('mousemove', dragMoveText);
            svg.addEventListener('mouseup', dragEndText);
          });
          // Touch events
          el.addEventListener('touchstart', function(evt) {
            selectText(shape.id);
            const touch = evt.touches[0];
            const rect = svg.getBoundingClientRect();
            dragOffset = { x: touch.clientX - rect.left - shape.x, y: touch.clientY - rect.top - shape.y };
            svg.addEventListener('touchmove', dragMoveTextTouch);
            svg.addEventListener('touchend', dragEndTextTouch);
            evt.preventDefault();
          });
        }
        svg.appendChild(el);
      });
      renderSelectedTextPanel();
    }

    function selectText(id) {
      selectedTextId = id;
      renderSelectedTextPanel();
      drawFlag(userFlag);
    }

    function dragMoveText(evt) {
      if (!selectedTextId || dragOffset == null) return;
      let txt = userFlag.find(shape => shape.id === selectedTextId);
      txt.x = evt.offsetX - dragOffset.x;
      txt.y = evt.offsetY - dragOffset.y;
      drawFlag(userFlag);
    }
    function dragEndText(evt) {
      dragOffset = null;
      const svg = document.getElementById('flagCanvas');
      svg.removeEventListener('mousemove', dragMoveText);
      svg.removeEventListener('mouseup', dragEndText);
    }
    function dragMoveTextTouch(evt) {
      if (!selectedTextId || dragOffset == null) return;
      const touch = evt.touches[0];
      const svg = document.getElementById('flagCanvas');
      const rect = svg.getBoundingClientRect();
      let txt = userFlag.find(shape => shape.id === selectedTextId);
      txt.x = touch.clientX - rect.left - dragOffset.x;
      txt.y = touch.clientY - rect.top - dragOffset.y;
      drawFlag(userFlag);
    }
    function dragEndTextTouch(evt) {
      dragOffset = null;
      const svg = document.getElementById('flagCanvas');
      svg.removeEventListener('touchmove', dragMoveTextTouch);
      svg.removeEventListener('touchend', dragEndTextTouch);
    }
    function renderSelectedTextPanel() {
      const panel = document.getElementById('selectedTextPanel');
      if (!selectedTextId) {
        panel.innerHTML = '<span class="selectedTextMsg">Tap a letter/text to select/edit.</span>';
        return;
      }
      let txt = userFlag.find(shape => shape.id === selectedTextId);
      if (!txt) {
        panel.innerHTML = '';
        return;
      }
      panel.innerHTML = `
        <label>Text: <input type="text" id="txtText" value="${txt.text}" /></label><br/>
        <label style="display:inline-block;width:55px;">Color:</label>
        <input type="color" id="txtColor" value="${txt.fill}" style="vertical-align:middle;"/><br/>
        <label style="display:inline-block;width:55px;">Size:</label>
        <input type="number" id="txtSize" min="12" max="200" value="${txt.fontSize}" style="width:50px;"/><br/>
        <button onclick="deleteSelectedText()">Delete</button>
      `;
      document.getElementById('txtText').oninput = function() {
        txt.text = this.value;
        drawFlag(userFlag);
      };
      document.getElementById('txtColor').oninput = function() {
        txt.fill = this.value;
        drawFlag(userFlag);
      };
      document.getElementById('txtSize').oninput = function() {
        txt.fontSize = +this.value;
        drawFlag(userFlag);
      };
    }
    function deleteSelectedText() {
      userFlag = userFlag.filter(shape => shape.id !== selectedTextId);
      selectedTextId = null;
      drawFlag(userFlag);
    }
    function loadFlag(key) {
      userFlag = [...flagTemplates[key]];
      selectedTextId = null;
      drawFlag(userFlag);
    }
    // Export SVG function
    function exportSVG() {
      const svg = document.getElementById('flagCanvas');
      const serializer = new XMLSerializer();
      let svgContent = serializer.serializeToString(svg);
      let blob = new Blob([svgContent], {type: "image/svg+xml"});
      let url = URL.createObjectURL(blob);
      let link = document.createElement("a");
      link.href = url;
      link.download = "flag.svg";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
    // Export PNG with canvas workaround
    function exportPNG() {
      const svg = document.getElementById('flagCanvas');
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      canvas.width = svg.width.baseVal.value;
      canvas.height = svg.height.baseVal.value;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        const link = document.createElement('a');
        link.download = 'flag.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
    }
    // Initifunction addColoredSE() {
  // Removes previous texts, sets background to white
  userFlag = [
    { type: "rect", x: 0, y: 0, width: 320, height: 200, fill: "#fff" } // white background
  ];
  const chars = [
    { ch: ".", color: "#27ae60" },    // green dot
    { ch: "s", color: "#2980ff" },    // blue s
    { ch: "e", color: "#f4d03f" }     // yellow e
  ];
  let xStart = 130;
  chars.forEach((c, i) => {
    userFlag.push({
      type: "text", text: c.ch,
      x: xStart + i * 28, y: 110,
      fontSize: 56,
      fill: c.color,
      fontWeight: "bold",
      id: "l" + (Math.random() * 100000).toFixed(0)
    });
  });
  selectedTextId = null;
  drawFlag(userFlag);
}
al flag
    window.onload = () => loadFlag('se');
  </script>
</body>
</html>
